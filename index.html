<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9ecf, #ffd6e8);
        }

        .login {
            background: white;
            padding: 35px;
            border-radius: 25px;
            width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
        }

        h1 {
            color: #ff3b8d;
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 20px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ff9ecf;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: #ff3b8d;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #ff1f74;
        }
    </style>

</head>

<body>

    <div class="login">

        <h1>Hi Meena ❤️</h1>

        <p>اكتبي اليوم والشهر</p>

        <input type="number" id="day" placeholder="اليوم">

        <input type="number" id="month" placeholder="الشهر">

        <button onclick="login()">دخول 💖</button>

    </div>

    <script>

        function login() {

            let day = document.getElementById("day").value;

            let month = document.getElementById("month").value;

            if (day == "16" && month == "5") {

                window.location.href = "memories.html";

            } else {

                alert("اليوم أو الشهر غير صحيح ❤️");

            }

        }

    </script>

</body>
